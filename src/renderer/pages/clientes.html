<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - SUIT-TECH</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    (function() {
      const sessao = localStorage.getItem('sessao_suittech');
      if (!sessao) { window.location.href = 'login.html'; return; }
      try {
        const dados = JSON.parse(sessao);
        if (!dados.logado) { window.location.href = 'login.html'; return; }
      } catch (e) { window.location.href = 'login.html'; }
    })();
  </script>
  <link rel="stylesheet" href="../css/tema-novo-overrides.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo"><img src="../assets/logo.png" alt="SUIT-TECH"></span>
        <div>
          <h1>SUIT-TECH</h1>
          <small>Assistência Técnica</small>
        </div>
      </div>
      <div id="menu-container"></div>
      <footer class="sidebar-footer">
        <span>Rodando local</span>
        <br>
        <button onclick="fazerLogout()" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 12px; margin-top: 8px;">🚪 Sair</button>
      </footer>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="topbar-left">
          <h2>👥 Clientes</h2>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary" onclick="openClientModal()">+ Novo Cliente</button>
          <button class="btn btn-success" onclick="window.location.href='orcamentos.html'" title="Ir para Orçamentos">📋 Orçamentos</button>
        </div>
      </header>

      <section class="panel">
        <div class="toolbar">
          <input type="text" id="search-client" placeholder="🔍 Buscar cliente..." oninput="renderClients()">
          <span style="color: var(--text-muted); font-size: 13px;" id="client-count">0 clientes</span>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>CPF</th>
                <th>Endereço</th>
                <th class="actions">Ações</th>
              </tr>
            </thead>
            <tbody id="clients-table">
              <tr><td colspan="6" class="empty">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL CLIENTE -->
  <div id="client-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="client-modal-title">Novo Cliente</h3>
        <button class="close" onclick="closeClientModal()">&times;</button>
      </div>
      <form id="client-form" onsubmit="saveClient(event)">
        <input type="hidden" id="client-id">
        <div class="form-grid">
          <div class="form-group span-2">
            <label>Nome *</label>
            <input type="text" id="client-name" required placeholder="Digite o nome completo">
          </div>
          <div class="form-group">
            <label>Telefone *</label>
            <input type="text" id="client-phone" required placeholder="(00) 00000-0000">
          </div>
          <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="client-email" placeholder="email@exemplo.com">
          </div>
          <div class="form-group">
            <label>CPF *</label>
            <input type="text" id="client-cpf" required placeholder="000.000.000-00">
          </div>
          <div class="form-group span-2">
            <label>Endereço *</label>
            <input type="text" id="client-address" required placeholder="Rua, número, bairro, cidade">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" onclick="closeClientModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">💾 Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function showToast(mensagem, tipo = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = mensagem;
      toast.className = 'toast toast-' + tipo;
      setTimeout(() => toast.classList.add('show'), 100);
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function fazerLogout() {
      if (confirm('Deseja realmente sair?')) {
        localStorage.removeItem('sessao_suittech');
        window.location.href = 'login.html';
      }
    }

    let clientsCache = [];

    // ============================================
    // CARREGAR CLIENTES
    // ============================================
    async function loadClients() {
      try {
        if (typeof window.api === 'undefined' || !window.api.buscar) {
          clientsCache = [];
          renderClients();
          return;
        }
        const resultado = await window.api.buscar('clientes');
        if (resultado.sucesso) {
          clientsCache = resultado.dados || [];
          renderClients();
        } else {
          clientsCache = [];
          renderClients();
        }
      } catch (erro) {
        console.error('Erro ao carregar clientes:', erro);
        clientsCache = [];
        renderClients();
      }
    }

    // ============================================
    // RENDERIZAR
    // ============================================
    function renderClients() {
      const q = document.getElementById('search-client')?.value.toLowerCase() || '';
      const tbody = document.getElementById('clients-table');
      const countEl = document.getElementById('client-count');
      if (!tbody) return;

      const filtered = clientsCache.filter(c =>
        (c.nome || '').toLowerCase().includes(q) ||
        (c.telefone || '').toLowerCase().includes(q) ||
        (c.email || '').toLowerCase().includes(q)
      );

      if (countEl) countEl.textContent = `${filtered.length} clientes`;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty">${clientsCache.length === 0 ? 'Nenhum cliente cadastrado' : 'Nenhum cliente encontrado'}</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(c => `
        <tr>
          <td><strong>${c.nome || '-'}</strong></td>
          <td>${c.telefone || '-'}</td>
          <td>${c.email || '-'}</td>
          <td>${c.cpf || '-'}</td>
          <td>${c.endereco || '-'}</td>
          <td class="actions">
            <button class="btn btn-primary" onclick="editClient('${c._id}')" style="padding:4px 12px;font-size:12px;" title="Editar">✏️</button>
            <button class="btn btn-success" onclick="contatarCliente('${c._id}')" style="padding:4px 12px;font-size:12px;" title="WhatsApp">💬</button>
            <button class="btn btn-danger" onclick="deleteClient('${c._id}')" style="padding:4px 12px;font-size:12px;" title="Excluir">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    // ============================================
    // MODAL
    // ============================================
    function openClientModal(client = null) {
      document.getElementById('client-modal-title').textContent = client ? '✏️ Editar Cliente' : '➕ Novo Cliente';
      document.getElementById('client-id').value = client ? client._id : '';
      document.getElementById('client-name').value = client ? client.nome : '';
      document.getElementById('client-phone').value = client ? client.telefone : '';
      document.getElementById('client-email').value = client ? client.email : '';
      document.getElementById('client-cpf').value = client ? client.cpf : '';
      document.getElementById('client-address').value = client ? client.endereco : '';
      document.getElementById('client-modal').classList.add('open');
    }

    function closeClientModal() {
      document.getElementById('client-modal').classList.remove('open');
    }

    // ============================================
    // SALVAR
    // ============================================
    async function saveClient(e) {
      e.preventDefault();
      
      const id = document.getElementById('client-id').value;
      const body = {
        nome: document.getElementById('client-name').value.trim(),
        telefone: document.getElementById('client-phone').value.trim(),
        email: document.getElementById('client-email').value.trim(),
        cpf: document.getElementById('client-cpf').value.trim(),
        endereco: document.getElementById('client-address').value.trim()
      };

      if (!body.nome || !body.telefone || !body.cpf || !body.endereco) {
        showToast('❌ Nome, Telefone, CPF e Endereço são obrigatórios!', 'error');
        return;
      }
      if (window.suitValidarCPF && !window.suitValidarCPF(body.cpf)) {
        showToast('❌ CPF inválido. Confira os números informados!', 'error');
        return;
      }
      const cpfNormalizado = body.cpf.replace(/\D/g, '');
      const clienteDuplicado = clientsCache.find(cliente =>
        cliente._id !== id && String(cliente.cpf || '').replace(/\D/g, '') === cpfNormalizado
      );
      if (clienteDuplicado) {
        showToast('❌ Já existe um cliente cadastrado com este CPF!', 'error');
        return;
      }

      try {
        if (typeof window.api === 'undefined' || !window.api.salvar) {
          showToast('❌ Banco de dados não disponível', 'error');
          return;
        }

        let resultado;
        if (id) {
          resultado = await window.api.atualizar('clientes', id, body);
        } else {
          resultado = await window.api.salvar('clientes', body);
        }

        if (resultado.sucesso) {
          closeClientModal();
          showToast('✅ Cliente salvo com sucesso!', 'success');
          await loadClients();
        } else {
          showToast('❌ Erro: ' + resultado.erro, 'error');
        }
      } catch (erro) {
        console.error('Erro:', erro);
        showToast('❌ Erro: ' + erro.message, 'error');
      }
    }

    // ============================================
    // EDITAR
    // ============================================
    async function editClient(id) {
      try {
        const c = clientsCache.find(x => x._id === id);
        if (c) {
          openClientModal(c);
        } else {
          showToast('❌ Cliente não encontrado', 'error');
        }
      } catch (erro) {
        console.error('Erro:', erro);
        showToast('❌ Erro ao buscar cliente', 'error');
      }
    }

    async function contatarCliente(id) {
      const cliente = clientsCache.find(c => c._id === id);
      if (!cliente) { showToast('❌ Cliente não encontrado', 'error'); return; }
      const numeroLimpo = String(cliente.telefone || '').replace(/\D/g, '');
      if (numeroLimpo.length < 10) { showToast('❌ Telefone inválido para WhatsApp', 'error'); return; }
      const numero = numeroLimpo.startsWith('55') ? numeroLimpo : '55' + numeroLimpo;
      const mensagem = prompt('💬 Mensagem para ' + cliente.nome + ':', `Olá ${cliente.nome}, aqui é da SUIT-TECH.`);
      if (mensagem === null) return;
      const texto = encodeURIComponent(mensagem || `Olá ${cliente.nome}, aqui é da SUIT-TECH.`);
      const appUrl = `whatsapp://send?phone=${numero}&text=${texto}`;
      const webUrl = `https://wa.me/${numero}?text=${texto}`;
      try {
        if (window.electron?.abrirWhatsAppDesktop) {
          const resultado = await window.electron.abrirWhatsAppDesktop(appUrl);
          if (resultado?.sucesso) { showToast('📱 WhatsApp Desktop a ser aberto...', 'success'); return; }
        }
      } catch (erro) { console.error('WhatsApp Desktop:', erro); }
      window.open(webUrl, '_blank');
      showToast('📤 WhatsApp Web a ser aberto...', 'success');
    }

    // ============================================
    // DELETAR
    // ============================================
    async function deleteClient(id) {
      const cliente = clientsCache.find(c => c._id === id);
      if (!confirm(`❌ Excluir "${cliente?.nome || 'este cliente'}"?`)) return;

      try {
        if (typeof window.api === 'undefined' || !window.api.deletar) {
          showToast('❌ Banco de dados não disponível', 'error');
          return;
        }
        const resultado = await window.api.deletar('clientes', id);
        if (resultado.sucesso) {
          showToast('✅ Cliente excluído!', 'success');
          await loadClients();
        } else {
          showToast('❌ Erro: ' + resultado.erro, 'error');
        }
      } catch (erro) {
        console.error('Erro:', erro);
        showToast('❌ Erro: ' + erro.message, 'error');
      }
    }

    // ============================================
    // FECHAR MODAL
    // ============================================
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('modal')) e.target.classList.remove('open');
    });

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', loadClients);

    // ============================================
    // EXPOSIÇÃO GLOBAL
    // ============================================
    window.loadClients = loadClients;
    window.renderClients = renderClients;
    window.openClientModal = openClientModal;
    window.closeClientModal = closeClientModal;
    window.saveClient = saveClient;
    window.editClient = editClient;
    window.deleteClient = deleteClient;
    window.contatarCliente = contatarCliente;
    window.showToast = showToast;
    window.fazerLogout = fazerLogout;
  </script>

  <script src="../js/carregarMenu.js"></script>

  <script src="../js/glitter.js"></script>
</body>
</html>
